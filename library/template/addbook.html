<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>addbook</title>
    <style>
        input{
            font-size: 16px;
        }
        button{
            font-size: 20px;
            background-color: gray;
            height: 40px;
            width: 100px;
        }
    </style>
</head>
<body style="background-image: url('../image/b.jpg');background-size: cover;">
    <div align="center" width="100%" height="150px" style="background-image: url('../image/head.jpg');background-size: cover;margin: 0%;">
        <br><br> <h1 style="color: white;">E-LIBRARY</h1>
        <nav style="font-size: 25px; padding: 20px;">
         <a href="../template/index.html" style="color: rgb(255, 255, 255);">HOME |</a>
        <a href="../template/index.html"style="color: rgb(255, 255, 255);">VIEW BOOK |</a>
        <a href="../template/login.html"style="color: rgb(255, 255, 255);">LOGIN |</a>
        </nav>
    </div>
   <center>
    <div style="margin-top: 80px; height: 550px; width: 400px; box-shadow: 0px 4px 15px brown; border: 2px solid brown; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 10px; padding: 20px; background-color: rgba(0, 0, 0, 0.3);">
        <h1 style="font-size: 24px; color: aliceblue; text-align: center; margin-bottom: 20px;">ADD BOOK</h1>
        
        <div align="left" style="margin-left: 20px; color: aliceblue;">
            <p style="margin: 5px 0; font-size: 14px;">BOOK TITLE</p>
            <input type="text" placeholder="Enter Book Title" style="width: 90%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;"><br>
            
            <p style="margin: 5px 0; font-size: 14px;">AUTHOR</p>
            <input type="text" placeholder="Author Name" style="width: 90%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;"><br>
            
            <p style="margin: 5px 0; font-size: 14px;">CATEGORY</p>
            <input type="text" placeholder="Book Category" style="width: 90%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;"><br>
            
            <p style="margin: 5px 0; font-size: 14px;">IMAGE UPLOAD</p>
            <input type="file" accept=".png, .jpg, .jpeg" style="width: 90%; margin-bottom: 15px; color: white;"><br>
            
            <div align="center" style="margin-right: 20px;">
                <button style="padding: 10px 25px; background-color: brown; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                    <a href="../template/addbook.html" style="color: white; text-decoration: none;">Submit</a>
                </button>
            </div>
        </div>
    </div>
</center>
</body>
</html>
