<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>kba</title>
    </head>
    <body style="margin:0; background-color: #F4F7FB;">
        <div style="background-color: #f8cbcb;">
            <table width="100%">
                <tr>
                    <td><img src="image/kbalogo.png" height="60" width="60" style="padding:10px;"></td>
                    <th align="right">
                         <nav style="padding-right: 50px;font-size: large; color:rgb(240, 240, 243);">
                            <a href="index.html">HOME |</a>
                            <a href="##">COURSE |</a>
                            <a href="#">CONTACT US |</a>
                            <a href="#">ADD COURSE |</a>
                            <a href="login.html">LOGIN |</a>
                        </nav>
                    </th>
                </tr>
            </table> 
        </div>
        <div style="margin-top: 60px;">
            <center>
            <form action="courses.html">
                <table bgcolor="#f8cbcb" cellspacing="30">
                    <tr>
                        <td colspan="2" align="center">
                            <h1>Add Course</h1>
                        </td>
                    </tr>
                    <tr>
                        <td>Course Name : </td>
                        <td>
                            <input type="text" placeholder="Enter course name "required>
                        </td>
                    </tr>
                    <tr>
                        <td>Course ID : </td>
                        <td>
                            <input type="text" placeholder="Enter course ID" required>
                        </td>
                    </tr>
                    <tr>
                        <td>Course Type : </td>
                        <td>
                            <select name="course" required>
                                <option value="a">Self-placed</option>
                                <option value="b">Aided</option>
                                <option value="c">Govt</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Description : </td>
                        <td>
                            <textarea rows="5" cols="30" placeholder="Enter a brief description"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td>Price : </td>
                        <td>
                            <select name="price">
                                <option value="p1">5000</option>
                                <option value="p2">7000</option>
                                <option value="p3">8000</option>
                                <option value="p4">10000</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Add Course">
                        </td>
                    </tr>
                </table>
            </form>
            </center>
            </div>
    </body>
</html>
