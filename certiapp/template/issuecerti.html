<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>certificate</title>
</head>
<body style="background-color: rgb(193, 197, 201);">
    <div>
        <table width="100%">
            <tr>
                <td style="margin-left: 30px;">
                    <h1><strong>Certificate Dapp</strong></h1>
                </td>
                <td>
                <nav align="right" style="margin: 30px;">
                    <a href="../template/index.html" style="padding-right: 20px;"><button style="background-color: blue;color: white; width: 100px; height: 45px; font-size: 16px;"><strong> HOME </strong></button></a>
                    <a href="../template/issuecerti.html" style="padding-right: 20px;"><button style="color: rgb(12, 1, 1); width: 200px; height: 45px; font-size: 16px;"><strong> ISSUE CERTIFICATE </strong></button></a>
                </nav>
                </td>
             </tr>
        </table>
    </div>
    <div align="center" style="background-color: rgb(248, 243, 236); margin-top: 30px;width: 60%;margin-left: 300px;">  
        <div align="left" style="margin-left: 50px;padding-top: 10px;">
            <h2>ISSUE NEW CERTIFICATE</h2>
            <form style="font-size: 20px;">
                <label>Select Course* :</label><br>
                <select name="course" style="width: 300px; height: 35px; font-size: 16px; box-sizing: border-box;">
                    <option value="c1">Certified Blockchain Associate</option>
                    <option value="c2">Certified Artificial Intelligence Associate</option>
                    <option value="c3">Certified Mechine Learning Associate</option>
                </select><br><br>
                <label>Certificate ID* :</label><br>
                <input type="text" placeholder="Certificate ID"style="width: 300px; height: 35px; font-size: 16px; box-sizing: border-box;"><br><br>
                <label>Candidate Name* :</label><br>
                <input type="text" placeholder="Candidate Name" style="width: 300px; height: 35px; font-size: 16px; box-sizing: border-box;"><br><br>
                <label>Select Grade* :</label><br>
                 <select name="grade" style="width: 300px; height: 35px; font-size: 16px; box-sizing: border-box;">
                            <option value="g1">S</option>
                            <option value="g2">A+</option>
                            <option value="g3">A</option>
                            <option value="g4">B+</option>
                            <option value="g5">B</option>
                            <option value="g5">c+</option>
                            <option value="g6">C</option>
                            <option value="g7">P</option>
                            <option value="g8">F</option>
                        </select><br><br>
                <label>Issue Date* :</label><br>
                <input type="date" style="width: 300px; height: 35px; font-size: 16px; box-sizing: border-box;"><br><br>
                <button type="submit" style="font-size: 16px;padding: 10px 20px; background-color: aqua;">Issue Certificate</button>
            </form>
        </div>
    </div>
</body>
</html>
