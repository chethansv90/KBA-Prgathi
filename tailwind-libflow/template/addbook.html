<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>addbook</title>
</head>
<body class="container m-0 bg-blue-200">
    <header class=" bg-blue-900">
        <nav class=" flex justify-between w-full   p-2">
            <a><img class="w-8 md:w-16 lg:w-12" src="../image/logo.jpg" alt="logo"></a>
            <h1 class="text-lg font-bold">LIB-FLOW</h1>
            <ul class="flex gap-4 font-bold">
                <li><a href="../template/index.html">HOME</a></li>
                <li><a href="../template/login.html">LOGIN</a></li>
                <li><a href="../template/sighup.html">SIGN UP</a></li>
                <li><a href="../template/addbook.html">ADD BOOK</a></li>
            </ul>
        </nav>
    </header>

    <div class="w-full max-w-md mx-auto mt-16 p-6 bg-blue-900 rounded-xl shadow-lg border-2 border-blue-700">
  <h1 class="text-2xl font-bold text-center text-white mb-6">ADD BOOK</h1>
  
  <form action="" class="flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium text-blue-100 mb-1">Title</label>
      <input 
        type="text" 
        placeholder="Title of book" 
        class="w-full px-3 py-2 bg-blue-950/60 border border-blue-400/40 rounded-lg text-white placeholder-blue-300/50 focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
    </div>
    <div>
      <label class="block text-sm font-medium text-blue-100 mb-1">Image</label>
      <input 
        type="file" 
        class="w-full text-sm text-blue-200 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-700 file:text-white hover:file:bg-blue-600 cursor-pointer"
      >
    </div>
    <div>
      <label class="block text-sm font-medium text-blue-100 mb-1">Author Name</label>
      <input 
        type="text" 
        placeholder="Author's name"
        class="w-full px-3 py-2 bg-blue-950/60 border border-blue-400/40 rounded-lg text-white placeholder-blue-300/50 focus:outline-none focus:ring-2 focus:ring-blue-400" >
    </div>
    <div>
      <label class="block text-sm font-medium text-blue-100 mb-1">Content</label>
      <textarea
        rows="3"
        placeholder="Brief description or content..."
        class="w-full px-3 py-2 bg-blue-950/60 border border-blue-400/40 rounded-lg text-white placeholder-blue-300/50 focus:outline-none focus:ring-2 focus:ring-blue-400"
      ></textarea>
    </div>
    <button 
      type="submit" 
      class="mt-2 w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow transition-colors focus:outline-none focus:ring-2 focus:ring-blue-300">
      Submit
    </button>
  </form>
</div>

</body>
</html>
