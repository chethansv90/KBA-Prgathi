<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>calculator</title>
</head>
<body>
    <div>
        <table>
            <tr >
                <td colspan="4">
                    <h3>casio</h3>
                    <input class="display" type="text" readonly>
                </td>
            </tr>
            <tr>
                <td><button class="key">Back</button></td>
                <td><button class="key">AC</button></td>
                <td><button class="key">%</button></td>
                <td><button class="key">/</button></td>
            </tr>
            <tr>
                <td><button class="no">7</button></td>
                <td><button class="no">8</button></td>
                <td><button class="no">9</button></td>
                <td><button class="key">*</button></td>
            </tr>
            <tr>
                <td><button class="no">4</button></td>
                <td><button class="no">5</button></td>
                <td><button class="no">6</button></td>
                <td><button class="key">-</button></td>
            </tr>
            <tr>
                <td><button class="no">1</button></td>
                <td><button class="no">2</button></td>
                <td><button class="no">3</button></td>
                <td><button class="key">+</button></td>
            </tr>
            <tr>
                <td><button class="key">+/-</button></td>
                <td><button class="no">0</button></td>
                <td><button class="key">.</button></td>
                <td><button class="key">=</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
